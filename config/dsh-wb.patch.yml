- insert:
    - id: dsh-infinite-gen-5
      name: 'dsh-infinite-gen-5'

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4.1-flash

- id: llm-deepseek
  config:
    baseURL: http://127.0.0.1:8790/v1
    apiKey: sk-local-ig5
